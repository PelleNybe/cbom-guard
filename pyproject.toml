[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "cbom-guard"
version = "0.1.0"
description = "Automated Post-Quantum Cryptography (PQC) code scanner, CycloneDX 1.6 CBOM generator, SARIF exporter, and GitHub PR remediation engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Pelle Nyberg", email = "pelle@coraxcolab.com" },
]
maintainers = [
  { name = "Corax CoLAB", email = "hello@coraxcolab.com" },
]
keywords = [
  "post-quantum-cryptography",
  "pqc",
  "cbom",
  "cyclonedx",
  "sarif",
  "appsec",
  "static-analysis",
  "tree-sitter",
  "nist-pqc",
  "cnsa-2.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "tree-sitter>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-c>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "cyclonedx-python-lib>=7.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.7.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
cbom-guard = "cbom_guard.cli:app"

[project.urls]
Homepage = "https://github.com/CoraxCoLAB/cbom-guard"
Documentation = "https://github.com/CoraxCoLAB/cbom-guard/tree/main/docs"
Repository = "https://github.com/CoraxCoLAB/cbom-guard"
Issues = "https://github.com/CoraxCoLAB/cbom-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cbom_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = [
  "tree_sitter_python",
  "tree_sitter_javascript",
  "tree_sitter_c",
  "tree_sitter_cpp",
  "tree_sitter_go",
]
ignore_missing_imports = true
